<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .checkout-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 32px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Success state view */
        .success-state {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background-color: #dcfce7;
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }

        .success-state h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .success-state p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .reset-btn {
            padding: 10px 20px;
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .reset-btn:hover {
            background-color: #cbd5e1;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        
        <!-- Active Form View -->
        <div id="formView">
            <div class="header">
                <h1>Complete Payment</h1>
                <p>Enter your details to finish your subscription</p>
            </div>

            <form id="paymentForm" onsubmit="processPayment(event)">
                
                <!-- Account Credentials -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" required placeholder="••••••••" minlength="8">
                </div>

                <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">

                <!-- Credit Card Details -->
                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" required placeholder="4242 •••• •••• 4242" maxlength="19">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cardExpiry">Expiration Date</label>
                        <input type="text" id="cardExpiry" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cardCvc">CVC / CVV</label>
                        <input type="password" id="cardCvc" required placeholder="123" maxlength="4">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="payBtn">Pay $49.00</button>
            </form>

            <div class="secure-badge">
                <span>🔒 256-Bit SSL Encrypted Checkout</span>
            </div>
        </div>

        <!-- Success Confirmation View -->
        <div id="successView" class="success-state">
            <div class="success-icon">✓</div>
            <h2>Payment Successful!</h2>
            <p>Your subscription is active and your account has been created successfully. We've sent a receipt to your email.</p>
            <button class="reset-btn" onclick="resetForm()">Make Another Payment</button>
        </div>

    </div>

    <script>
        // Simple credit card spacing auto-formatter
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formatted += ' ';
                }
                formatted += value[i];
            }
            e.target.value = formatted;
        });

        // Simple expiry date auto-formatter (MM/YY)
        document.getElementById('cardExpiry').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                e.target.value = value.slice(0, 2) + '/' + value.slice(2, 4);
            } else {
                e.target.value = value;
            }
        });

        // Handle form submission and toggle success state view
        function processPayment(event) {
            event.preventDefault();
            
            const payBtn = document.getElementById('payBtn');
            payBtn.textContent = 'Processing...';
            payBtn.disabled = true;

            setTimeout(() => {
                document.getElementById('formView').style.display = 'none';
                document.getElementById('successView').style.display = 'block';
                payBtn.textContent = 'Pay $49.00';
                payBtn.disabled = false;
            }, 1200);
        }

        // Reset flow back to form input
        function resetForm() {
            document.getElementById('paymentForm').reset();
            document.getElementById('successView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        }
    </script>
</body>
</html>
